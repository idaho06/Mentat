---
version: "2.1"
services:
  mentat:
    image: mentat
    build:
      context: .
      secrets:
        - password
        - adminpassword
    container_name: Mentat
    environment:
      - PUID=65534
      - PGID=65534
      - TZ=Europe/Madrid
    volumes:
      - /srv/almacen/mentat/logs:/var/log/mentat
    restart: unless-stopped

secrets:
  password:
    file: ./secrets/password.txt
  adminpassword:
    file: ./secrets/adminpassword.txt
