# ngircd configuration for the opt-in real-server test suite.
# Mounted at /config by docker-compose.test.yml (lscr.io/linuxserver/ngircd).

[Global]
Name = irc.mentat.test
Info = Mentat test server
AdminInfo1 = Mentat tests
Listen = 0.0.0.0
Ports = 6667
MotdPhrase = "Mentat test server"
PidFile = /var/run/ngircd/ngircd.pid
ServerUID = abc
ServerGID = abc

[Limits]
# all test clients connect from the same address
MaxConnectionsIP = 0
PingTimeout = 120
PongTimeout = 20

[Options]
DNS = no
Ident = no
PAM = no
OperCanUseMode = yes

# No [Channel] section on purpose: the bot creates #mentat when it joins and
# gets +o, which the op/kick tests rely on.
